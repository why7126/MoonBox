# 本地环境矩阵 Compose：通过 env 文件和 profile 区分数据库与对象存储组合。
# 维护要求：新增 service、environment、ports、volumes、networks 时，必须同步 deploy/local/*.env.example 与 docs/02-deployment.md。
name: moonbox

services:
  # FastAPI 后端服务，负责 REST API、认证、数据库访问和对象存储访问。
  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-moonbox-backend:local}
    container_name: ${BACKEND_CONTAINER_NAME:-moonbox-backend}
    env_file:
      - ${MOONBOX_DEPLOY_ENV_FILE:-../../.env}
    environment:
      APP_NAME: ${APP_NAME:-MoonBox}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-local-env}
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_DEPLOYMENT_MODE: ${DATABASE_DEPLOYMENT_MODE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sqlite/moonbox.db}
      SQLITE_DATABASE_URL: ${SQLITE_DATABASE_URL:-sqlite:////app/data/sqlite/moonbox.db}
      MYSQL_DATABASE_URL: ${MYSQL_DATABASE_URL:-mysql+pymysql://moonbox:change-me@mysql:3306/moonbox}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_COLLATION: ${MYSQL_COLLATION:-utf8mb4_0900_ai_ci}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-+08:00}
      OBJECT_STORAGE_TYPE: ${OBJECT_STORAGE_TYPE:-minio}
      OBJECT_STORAGE_DEPLOYMENT_MODE: ${OBJECT_STORAGE_DEPLOYMENT_MODE:-self-hosted-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbox}
      OBJECT_STORAGE_KEY_PATTERN: ${OBJECT_STORAGE_KEY_PATTERN:-{resource_type}/{subtype}/{uuid}.{ext}}
      OBJECT_STORAGE_PREFIX_IMAGES_ORIGINAL: ${OBJECT_STORAGE_PREFIX_IMAGES_ORIGINAL:-images/original/}
      OBJECT_STORAGE_PREFIX_IMAGES_THUMBNAILS: ${OBJECT_STORAGE_PREFIX_IMAGES_THUMBNAILS:-images/thumbnails/}
      OBJECT_STORAGE_PREFIX_IMAGES_PROCESSED: ${OBJECT_STORAGE_PREFIX_IMAGES_PROCESSED:-images/processed/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_SOURCE: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_SOURCE:-documents/source/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_PREVIEW: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_PREVIEW:-documents/preview/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_PROCESSED: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_PROCESSED:-documents/processed/}
      OBJECT_STORAGE_PREFIX_IMPORTS_SOURCE: ${OBJECT_STORAGE_PREFIX_IMPORTS_SOURCE:-imports/source/}
      OBJECT_STORAGE_PREFIX_IMPORTS_PROCESSED: ${OBJECT_STORAGE_PREFIX_IMPORTS_PROCESSED:-imports/processed/}
      OBJECT_STORAGE_PREFIX_EXPORTS_RESULT: ${OBJECT_STORAGE_PREFIX_EXPORTS_RESULT:-exports/result/}
      OBJECT_STORAGE_PREFIX_TMP_UPLOADS: ${OBJECT_STORAGE_PREFIX_TMP_UPLOADS:-tmp/uploads/}
    ports:
      - "${HOST_PORT_BACKEND:-18101}:8000"
    volumes:
      - ../../data/runtime/backend:/app/data
      - ../../data/tmp:/app/tmp
    networks:
      - moonbox

  # React Web 服务，由 Nginx 托管 Vite 构建后的静态资源。
  web:
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
    image: ${WEB_IMAGE:-moonbox-web:local}
    container_name: ${WEB_CONTAINER_NAME:-moonbox-web}
    env_file:
      - ${MOONBOX_DEPLOY_ENV_FILE:-../../.env}
    environment:
      APP_NAME: ${APP_NAME:-MoonBox}
      APP_ENV: ${APP_ENV:-local}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18101}
    ports:
      - "${HOST_PORT_WEB:-18102}:80"
    depends_on:
      - backend
    networks:
      - moonbox

  # 项目自建 MinIO，仅 self-storage-* 环境通过 profile 启用。
  minio:
    profiles:
      - self-hosted-storage
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: ${MINIO_CONTAINER_NAME:-moonbox-minio}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports:
      - "${HOST_PORT_MINIO_API:-18103}:9000"
      - "${HOST_PORT_MINIO_CONSOLE:-18104}:9001"
    volumes:
      - ../../data/s3:/data
    networks:
      - moonbox

  # MinIO 初始化任务：创建单一项目 Bucket，并关闭匿名访问。
  minio-init:
    profiles:
      - self-hosted-storage
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:latest}
    container_name: ${MINIO_INIT_CONTAINER_NAME:-moonbox-minio-init}
    depends_on:
      - minio
    env_file:
      - ${MOONBOX_DEPLOY_ENV_FILE:-../../.env}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-change-me} $${MINIO_SECRET_KEY:-change-me};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-moonbox};
      mc anonymous set none local/$${MINIO_BUCKET:-moonbox};
      echo 'Object storage bucket initialized: '$${MINIO_BUCKET:-moonbox};
      "
    networks:
      - moonbox

  # 自建 MySQL，仅 *-self-mysql 环境通过 profile 启用。
  mysql:
    profiles:
      - self-hosted-db
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-moonbox-mysql}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moonbox}
      MYSQL_USER: ${MYSQL_USER:-moonbox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_COLLATION: ${MYSQL_COLLATION:-utf8mb4_0900_ai_ci}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HOST_PORT_MYSQL:-18106}:3306"
    volumes:
      - ../../data/mysql:/var/lib/mysql
    networks:
      - moonbox

  # Mintlify 产品手册预览服务；local 环境默认通过 docs-site profile 启动。
  docs-site:
    profiles:
      - docs-site
    image: ${MINTLIFY_NODE_IMAGE:-node:22-alpine}
    container_name: ${DOCS_SITE_CONTAINER_NAME:-moonbox-docs-site}
    working_dir: /workspace/mintlify
    volumes:
      - ../../mintlify:/workspace/mintlify:ro
      - ../../deploy/scripts/docs-site-static-server.mjs:/workspace/docs-site-static-server.mjs:ro
    ports:
      - "${HOST_PORT_MINTLIFY_DOCS:-18105}:3000"
    command: node /workspace/docs-site-static-server.mjs
    networks:
      - moonbox

networks:
  # 本地开发 bridge 网络；服务间通过 backend、web、minio、mysql 名称互访。
  moonbox:
    driver: bridge
