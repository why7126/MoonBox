# 单机常驻 Chat；只由显式 --chat-platform 加载。控制器拥有 Docker 权限，执行容器没有 socket。
services:
  backend:
    environment: &chat-platform-env
      MOONBOX_CHAT_EXECUTION_MODE: local-codex
      MOONBOX_CHAT_REPOSITORIES: ${MOONBOX_CHAT_REPOSITORIES}
      MOONBOX_CHAT_REPOSITORY_BINDINGS: ${MOONBOX_CHAT_REPOSITORY_BINDINGS}
      MOONBOX_CHAT_LIMITS: ${MOONBOX_CHAT_LIMITS}
      MOONBOX_CHAT_RETENTION: ${MOONBOX_CHAT_RETENTION}
      MOONBOX_CHAT_STATE_ROOT: /app/chat-state
      MOONBOX_CHAT_BACKUP_ROOT: /app/chat-backups
      MOONBOX_CHAT_LOCAL_SNAPSHOT_LIMIT: ${MOONBOX_CHAT_LOCAL_SNAPSHOT_LIMIT-2}
      MOONBOX_VERIFICATION_IMAGE_ID: ${MOONBOX_VERIFICATION_IMAGE_ID:-}
      MOONBOX_VERIFICATION_NODE_VERSION: ${MOONBOX_VERIFICATION_NODE_VERSION:-}
      MOONBOX_VERIFICATION_PNPM_VERSION: ${MOONBOX_VERIFICATION_PNPM_VERSION:-}
      MOONBOX_VERIFICATION_OS: ${MOONBOX_VERIFICATION_OS:-linux}
      MOONBOX_VERIFICATION_ARCH: ${MOONBOX_VERIFICATION_ARCH:-}
      MOONBOX_VERIFICATION_REGISTRY_URL: ${MOONBOX_VERIFICATION_REGISTRY_URL:-}
      MOONBOX_VERIFICATION_PREPARE_NETWORK: ${MOONBOX_VERIFICATION_PREPARE_NETWORK:-}
      MOONBOX_VERIFICATION_BROWSER_NETWORK: ${MOONBOX_VERIFICATION_BROWSER_NETWORK:-moonbox-network}
      MOONBOX_VERIFICATION_STATE_ROOT: ${MOONBOX_CHAT_HOST_ROOT}/verification/state
      MOONBOX_VERIFICATION_WORKSPACE_ROOT: ${MOONBOX_CHAT_HOST_ROOT}/verification/workspaces
      MOONBOX_VERIFICATION_ARTIFACT_ROOT: ${MOONBOX_CHAT_HOST_ROOT}/verification/artifacts
      MOONBOX_VERIFICATION_EVIDENCE_ROOT: ${MOONBOX_CHAT_HOST_ROOT}/verification/evidence
      DATABASE_TYPE: sqlite
      DATABASE_URL: sqlite:////app/data/sqlite/moonbox.db
      SQLITE_DATABASE_URL: sqlite:////app/data/sqlite/moonbox.db
    volumes:
      - ${MOONBOX_CHAT_HOST_ROOT}/state:/app/chat-state:ro
      - ${MOONBOX_CHAT_HOST_ROOT}/backups:/app/chat-backups
      - ${MOONBOX_CHAT_HOST_ROOT}/workspaces:${MOONBOX_CHAT_HOST_ROOT}/workspaces:ro
      - ${MOONBOX_CHAT_SOURCE_ROOT}:${MOONBOX_CHAT_SOURCE_ROOT}:ro
      - ./.agents:/app/governance/.agents:ro
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/state:${MOONBOX_CHAT_HOST_ROOT}/verification/state:ro
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/artifacts:${MOONBOX_CHAT_HOST_ROOT}/verification/artifacts:ro
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/evidence:${MOONBOX_CHAT_HOST_ROOT}/verification/evidence:ro
  chat-worker:
    container_name: ${CHAT_WORKER_CONTAINER_NAME:-moonbox-chat-worker}
    restart: unless-stopped
    init: true
    build:
      context: ./src/backend
      dockerfile: Dockerfile.chat-worker
      args:
        BACKEND_IMAGE: ${BACKEND_IMAGE:-moonbox-backend:local}
    image: moonbox-chat-worker:local
    networks:
      - app-network
    user: ${MOONBOX_CHAT_WORKER_UID}:${MOONBOX_CHAT_WORKER_GID}
    group_add:
      - ${MOONBOX_CHAT_DOCKER_GID:-0}
    environment:
      <<: *chat-platform-env
      APP_ENV: local
      OBJECT_STORAGE_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbox}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MOONBOX_CHAT_RUNTIME_ROOT: ${MOONBOX_CHAT_HOST_ROOT}/runtime
      MOONBOX_CHAT_AUTH_FILE: /run/secrets/codex-auth.json
    volumes:
      - ./data:/app/data
      - ${MOONBOX_CHAT_HOST_ROOT}/state:/app/chat-state
      - ${MOONBOX_CHAT_HOST_ROOT}/backups:/app/chat-backups
      - ${MOONBOX_CHAT_HOST_ROOT}/workspaces:${MOONBOX_CHAT_HOST_ROOT}/workspaces
      - ${MOONBOX_CHAT_HOST_ROOT}/runtime:${MOONBOX_CHAT_HOST_ROOT}/runtime
      - ${MOONBOX_CHAT_SOURCE_ROOT}:${MOONBOX_CHAT_SOURCE_ROOT}
      - ${MOONBOX_CHAT_AUTH_SOURCE}:/run/secrets/codex-auth.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./issues:/app/governance/issues:ro
      - ./iterations:/app/governance/iterations:ro
      - ./openspec:/app/governance/openspec:ro
      - ./.agents:/app/governance/.agents:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json,time; from pathlib import Path; v=json.loads(Path('/app/chat-state/worker-ready.json').read_text()); assert 0 <= time.time()-v['time'] < 5"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
    stop_grace_period: 90s
  verification-worker:
    profiles: [verification]
    container_name: ${VERIFICATION_WORKER_CONTAINER_NAME:-moonbox-verification-worker}
    restart: unless-stopped
    init: true
    image: moonbox-chat-worker:local
    command: [python, -m, app.verification.worker]
    networks:
      - app-network
    user: ${MOONBOX_CHAT_WORKER_UID}:${MOONBOX_CHAT_WORKER_GID}
    group_add:
      - ${MOONBOX_CHAT_DOCKER_GID:-0}
    environment:
      <<: *chat-platform-env
      APP_ENV: local
    volumes:
      - ./data:/app/data
      - ${MOONBOX_CHAT_SOURCE_ROOT}:${MOONBOX_CHAT_SOURCE_ROOT}:ro
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/state:${MOONBOX_CHAT_HOST_ROOT}/verification/state
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/workspaces:${MOONBOX_CHAT_HOST_ROOT}/verification/workspaces
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/artifacts:${MOONBOX_CHAT_HOST_ROOT}/verification/artifacts
      - ${MOONBOX_CHAT_HOST_ROOT}/verification/evidence:${MOONBOX_CHAT_HOST_ROOT}/verification/evidence
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.agents:/app/governance/.agents:ro
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 150s
