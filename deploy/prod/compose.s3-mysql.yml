# 生产 Compose：外部 MySQL + 外部 S3/MinIO 兼容对象存储，不启动本地 MinIO、MySQL 或 SQLite。
# 维护要求：新增 service、environment、ports、volumes、networks 时，必须同步 deploy/prod/*.env.example 与 docs/02-deployment.md。
name: moonbox

services:
  # 生产后端服务，结构化数据写入外部 MySQL，媒体对象写入外部对象存储。
  backend:
    image: ${BACKEND_IMAGE:-moonbox-backend}:${IMAGE_TAG:-v0.0.1}
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-moonbox-backend}
    env_file:
      - ${MOONBOX_DEPLOY_ENV_FILE:?Set MOONBOX_DEPLOY_ENV_FILE to production env}
    environment:
      APP_NAME: ${APP_NAME:-MoonBox}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in production env}
      DATABASE_TYPE: mysql
      DATABASE_DEPLOYMENT_MODE: external-mysql
      DATABASE_URL: ${DATABASE_URL:?Set production MySQL DATABASE_URL}
      MYSQL_DATABASE_URL: ${DATABASE_URL:?Set production MySQL DATABASE_URL}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_COLLATION: ${MYSQL_COLLATION:-utf8mb4_0900_ai_ci}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-+00:00}
      OBJECT_STORAGE_TYPE: minio
      OBJECT_STORAGE_DEPLOYMENT_MODE: external-minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set external object storage endpoint}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set external object storage access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set external object storage secret key}
      MINIO_SECURE: "true"
      MINIO_BUCKET: ${MINIO_BUCKET:?Set existing object storage bucket}
      OBJECT_STORAGE_KEY_PATTERN: ${OBJECT_STORAGE_KEY_PATTERN:-{resource_type}/{subtype}/{uuid}.{ext}}
      OBJECT_STORAGE_PREFIX_IMAGES_ORIGINAL: ${OBJECT_STORAGE_PREFIX_IMAGES_ORIGINAL:-images/original/}
      OBJECT_STORAGE_PREFIX_IMAGES_THUMBNAILS: ${OBJECT_STORAGE_PREFIX_IMAGES_THUMBNAILS:-images/thumbnails/}
      OBJECT_STORAGE_PREFIX_IMAGES_PROCESSED: ${OBJECT_STORAGE_PREFIX_IMAGES_PROCESSED:-images/processed/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_SOURCE: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_SOURCE:-documents/source/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_PREVIEW: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_PREVIEW:-documents/preview/}
      OBJECT_STORAGE_PREFIX_DOCUMENTS_PROCESSED: ${OBJECT_STORAGE_PREFIX_DOCUMENTS_PROCESSED:-documents/processed/}
      OBJECT_STORAGE_PREFIX_IMPORTS_SOURCE: ${OBJECT_STORAGE_PREFIX_IMPORTS_SOURCE:-imports/source/}
      OBJECT_STORAGE_PREFIX_IMPORTS_PROCESSED: ${OBJECT_STORAGE_PREFIX_IMPORTS_PROCESSED:-imports/processed/}
      OBJECT_STORAGE_PREFIX_EXPORTS_RESULT: ${OBJECT_STORAGE_PREFIX_EXPORTS_RESULT:-exports/result/}
      OBJECT_STORAGE_PREFIX_TMP_UPLOADS: ${OBJECT_STORAGE_PREFIX_TMP_UPLOADS:-tmp/uploads/}
    ports:
      - "${HOST_PORT_BACKEND:-8000}:8000"
    volumes:
      - ../../data/processed:/app/data/processed
      - ../../data/tmp:/app/data/tmp
    networks:
      - moonbox

  # 生产 Web 容器，托管已构建静态资源并访问生产后端 API。
  web:
    image: ${WEB_IMAGE:-moonbox-web}:${IMAGE_TAG:-v0.0.1}
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-moonbox-web}
    env_file:
      - ${MOONBOX_DEPLOY_ENV_FILE:?Set MOONBOX_DEPLOY_ENV_FILE to production env}
    environment:
      APP_NAME: ${APP_NAME:-MoonBox}
      APP_ENV: production
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set production API base URL}
    ports:
      - "${HOST_PORT_WEB:-5173}:80"
    depends_on:
      - backend
    networks:
      - moonbox

  # 生产产品手册预览/承载服务；默认随 prod 启动，不挂载运行时数据或密钥。
  docs-site:
    profiles:
      - docs-site
    image: ${MINTLIFY_NODE_IMAGE:-node:22-alpine}
    container_name: ${DOCS_SITE_CONTAINER_NAME:-moonbox-docs-site}
    working_dir: /workspace/mintlify
    volumes:
      - ../../mintlify:/workspace/mintlify:ro
      - ../../deploy/scripts/docs-site-static-server.mjs:/workspace/docs-site-static-server.mjs:ro
    ports:
      - "${HOST_PORT_MINTLIFY_DOCS:-3001}:3000"
    command: node /workspace/docs-site-static-server.mjs
    networks:
      - moonbox

networks:
  # 生产 bridge 网络包含业务服务与 docs-site；MySQL 与对象存储为外部服务。
  moonbox:
    driver: bridge
