[project]
name = "moonbox-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "minio>=7.2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.0",
  "pydantic>=2.8.0",
  "pymysql>=1.1.1",
  "sqlalchemy>=2.0.25",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
