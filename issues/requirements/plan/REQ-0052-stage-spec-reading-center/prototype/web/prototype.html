<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研发规范 · 交互草图</title><style>
:root{color-scheme:light dark;--bg:#f7f5ef;--fg:#272823;--line:#d8d5cc;--panel:#fffefa;--accent:#8c702c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui}header,main{padding:24px 36px}header{border-bottom:1px solid var(--line)}h1,h2{font-family:serif}button,input,select{font:inherit;padding:8px 12px;background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:2px}button{cursor:pointer}button:focus-visible{outline:2px solid var(--accent)}nav{display:flex;gap:12px;flex-wrap:wrap}.muted{opacity:.65}.board{display:flex;gap:12px;overflow:auto;padding:16px 0}.stage{min-width:180px;border:1px solid var(--line);padding:16px;background:var(--panel)}.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;margin-top:20px}article,aside{padding:24px;background:var(--panel);border:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;margin:8px 0}dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(580px,100vw);height:100vh;max-height:100vh;max-width:100vw;background:var(--panel);color:var(--fg);border:0;border-left:1px solid var(--line);padding:28px;overflow:auto}dialog::backdrop{background:#0005}[hidden]{display:none!important}.badge{color:var(--accent)}@media(max-width:999px){.layout{grid-template-columns:190px 1fr}}@media(max-width:599px){header,main{padding:16px}.layout{grid-template-columns:1fr}dialog{width:100vw}}@media(prefers-color-scheme:dark){:root{--bg:#191a18;--fg:#e7e5de;--line:#41423c;--panel:#22231f;--accent:#c2a35a}}
</style><header><span class="badge">MOONBOX / 项目规范</span><h1>理解规则，再推进工作</h1><p class="muted">交互草图 · 虚构数据 · 未连接产品 API</p><nav><button data-view="board">九阶段</button><button data-view="center">研发规范</button><button data-view="logs">迭代日志</button></nav></header><main><label>演示状态 <select id="state"><option value="">正常</option><option>加载中</option><option>暂无规范</option><option>读取失败，请重试</option><option>无权查阅</option><option>摘要已过期，请查看当前原文</option><option>历史正文不可取得</option></select></label><p id="notice" role="status"></p><section id="board"><h2>阶段流转规范</h2><div class="board" id="stages"></div></section><section id="center" hidden><h2>研发规范</h2><input id="search" placeholder="搜索示例规范标题" aria-label="搜索规范"><div class="layout"><aside id="directory"></aside><article id="content"></article></div></section><section id="logs" hidden><h2>规范迭代日志</h2><article><span class="muted">示例记录 · 2026-10-01</span><h3>补充验收证据要求</h3><p>原因：便于复核测试与视觉结果。</p><p>影响：验收中 → 已完成</p><p>历史版本：示例版本 A；历史正文不可取得。</p><p class="badge">本记录不能单独证明规范已生效。</p></article></section></main><dialog id="reader" aria-labelledby="reader-title"><button id="close">关闭</button><h2 id="reader-title"></h2><p class="badge">示例版本 A · 生效状态待核实</p><label>适用对象 <select id="kind"><option>需求</option><option>缺陷</option></select></label><div id="summary"></div><button id="original">查看完整原文</button></dialog><script>
const names=['采集池','规划中','待评审','已评审','迭代规划','待开发','研发中','验收中','已完成'];const texts=['确认信息完整并检查重复记录','补齐范围、用户故事与验收标准','形成评审结论，未通过时按结论处理','确认容量、优先级与依赖后纳入迭代','准备规格、设计和开发任务','确认启动条件与执行范围','完成实现、自检、测试与文档同步','确认验收证据，失败返修、通过后归档','查阅归档证据；后续改动另起变更'];let active=0,original=false;
function summary(){document.querySelector('#summary').innerHTML=original?'<h3>完整原文 · 示例</h3><p>此处展示同一来源版本的正文，正式实现按章节定位。</p><p>来源：rules/example.md · 指纹：demo-a</p>':'<h3>'+names[active]+' → '+(names[active+1]||'历史追溯')+'</h3><p>'+texts[active]+'</p><p>适用：'+document.querySelector('#kind').value+'</p><p>所需证据：以来源规则清单为准。</p><p>确认角色：按项目授权规则确定。</p><p class="muted">所有文案为布局示例，正式映射见需求文档。</p>';document.querySelector('#original').textContent=original?'返回阶段摘要':'查看完整原文'}
names.forEach((n,i)=>{const card=document.createElement('div');card.className='stage';const h=document.createElement('h3');h.textContent=n;const b=document.createElement('button');b.className='stage-open';b.textContent='流转规范';b.onclick=()=>{active=i;original=false;document.querySelector('#reader-title').textContent=n+'规范';summary();document.querySelector('#reader').showModal()};card.append(h,b);document.querySelector('#stages').append(card)});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>['board','center','logs'].forEach(id=>document.getElementById(id).hidden=id!==b.dataset.view));const reader=document.querySelector('#reader');document.querySelector('#close').onclick=()=>reader.close();reader.addEventListener('click',e=>{const r=reader.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)reader.close()},true);document.querySelector('#original').onclick=()=>{original=!original;summary()};document.querySelector('#kind').onchange=summary;document.querySelector('#state').onchange=e=>document.querySelector('#notice').textContent=e.target.value;
const docs=['流程规范：评审与迭代','专项规范：测试要求','专项规范：界面设计'];function directory(){const host=document.querySelector('#directory');host.replaceChildren();const results=docs.filter(x=>x.includes(document.querySelector('#search').value));results.forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>{const c=document.querySelector('#content');c.replaceChildren();const h=document.createElement('h3');h.textContent=x;const p=document.createElement('p');p.textContent='示例原文 · 当前项目 · 示例版本 A · 生效状态待核实。正式内容从受控来源读取。';c.append(h,p)};host.append(b)});if(!results.length)host.textContent='无匹配结果'}directory();document.querySelector('#directory button').click();document.querySelector('#search').oninput=directory;
</script></html>
