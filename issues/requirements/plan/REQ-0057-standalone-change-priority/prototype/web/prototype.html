<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立 Change 优先级交互原型</title><style>
:root{--bg:#F4F6FA;--panel:#EEF2F7;--fg:#202636;--muted:#677085;--line:#DDE3EE;--gold:#B9832E}body.dark{--bg:#0A0D14;--panel:#131826;--fg:#ECEAE4;--muted:#98A0B3;--line:#242A3A;--gold:#D8AC55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,"Noto Sans SC",sans-serif}main{max-width:1120px;margin:40px auto;padding:24px}h1{font-size:24px}h2{font-size:20px;margin:16px 0}p{color:var(--muted)}.toolbar,.meta,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar{margin:24px 0}button,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--fg)}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--gold);color:#101828}article{max-width:560px;padding:24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px}code{overflow-wrap:anywhere;color:var(--muted)}.tag{border:1px solid var(--line);padding:5px 9px;border-radius:4px}.meta{margin:16px 0}.editor{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}.actions{margin-top:16px}#message{color:var(--gold);min-height:20px}#toast{position:fixed;bottom:24px;right:24px;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:4px}#toast:empty{display:none}[hidden]{display:none!important}@media(max-width:600px){main{margin:0;padding:16px}article{padding:16px;width:100%}.toolbar{align-items:stretch}.toolbar label{width:100%}}
</style><main><p>需求中心 · 交互原型 / 全部为内存演示数据</p><h1>独立 Change 优先级</h1><p>仅演示本需求新增区域；不调用 API，不持久化，不执行归档。</p><div class="toolbar"><label>演示状态 <select id="scenario"><option value="normal">正常</option><option value="missing">未设置</option><option value="invalid">非法值</option><option value="readonly">无写权限</option><option value="archived">已归档</option><option value="error">保存失败</option><option value="conflict">版本冲突</option></select></label><label>筛选 <select id="filter"><option value="all">全部优先级</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option><option value="missing">未设置</option><option value="invalid">待核实</option></select></label><button id="theme">切换深浅主题</button></div><p id="empty" hidden>当前筛选下暂无独立 Change。</p><article id="card" data-issue-id="prototype-standalone-change"><code>prototype-standalone-change</code><h2>治理文档一致性优化</h2><div class="meta"><span id="badge" class="tag">优先级 P2</span><span class="tag">负责人未分配</span><span id="phase" class="tag">待开发</span></div><p id="notice">独立交付对象，无来源 Issue。</p><button id="edit">设置优先级</button><section id="editor" class="editor" aria-label="优先级编辑区" hidden><label for="level">交付优先级</label> <select id="level"><option value="">请选择优先级</option><option value="P0">P0 · 紧急</option><option value="P1">P1 · 较高</option><option value="P2">P2 · 常规</option><option value="P3">P3 · 较低</option></select><p>保存后更新这张卡片；不影响验收和归档条件。</p><p id="message" role="status"></p><div class="actions"><button id="save" class="primary">保存</button><button id="reload" hidden>重载最新值</button><button id="cancel">取消</button></div></section></article><div id="toast" role="status"></div></main><script>
const $=id=>document.getElementById(id);let value='P2',busy=false,blocked=false,epoch=0;function render(){const scenario=$('scenario').value;$('badge').textContent=value==='missing'?'优先级未设置':value==='invalid'?'优先级待核实':'优先级 '+value;const ro=['readonly','archived'].includes(scenario);$('edit').hidden=ro;$('phase').textContent=scenario==='archived'?'已完成':'待开发';$('notice').textContent=ro?'当前对象只读，可查看分级。':'独立交付对象，无来源 Issue。';let match=$('filter').value==='all'||$('filter').value===value;$('card').hidden=!match;$('empty').hidden=match}function closeEditor(){epoch++;busy=false;blocked=false;$('editor').hidden=true;$('message').textContent='';$('reload').hidden=true;$('save').disabled=false;$('save').textContent='保存';$('cancel').disabled=false;$('level').disabled=false;if(!$('edit').hidden)$('edit').focus()}$('scenario').onchange=()=>{closeEditor();value=$('scenario').value==='missing'?'missing':$('scenario').value==='invalid'?'invalid':'P2';$('toast').textContent='';render()};$('filter').onchange=()=>{closeEditor();render()};$('theme').onclick=()=>document.body.classList.toggle('dark');$('edit').onclick=()=>{$('editor').hidden=false;$('level').value=/^P[0-3]$/.test(value)?value:'';$('level').focus()};$('cancel').onclick=closeEditor;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('editor').hidden)closeEditor()});$('reload').onclick=()=>{blocked=false;value='P1';$('level').value=value;$('message').textContent='已载入最新值，请重新选择。';$('reload').hidden=true;$('save').disabled=false;render()};$('save').onclick=()=>{if(busy||blocked)return;if(!$('level').value){$('message').textContent='请选择优先级。';return}busy=true;let token=++epoch;$('save').disabled=true;$('save').textContent='保存中…';$('level').disabled=true;setTimeout(()=>{if(token!==epoch)return;busy=false;$('level').disabled=false;$('save').textContent='保存';const s=$('scenario').value;if(s==='error'){$('message').textContent='保存失败，选择已保留。可重试或取消。';$('save').disabled=false;return}if(s==='conflict'&&!$('message').textContent.includes('最新值')){blocked=true;$('message').textContent='版本已变化，请重载后重新选择。';$('reload').hidden=false;return}const next=$('level').value;const changed=next!==value;value=next;closeEditor();render();$('toast').textContent=changed?'演示：优先级已保存':'演示：分级未变化';},600)};render();
</script></html>
