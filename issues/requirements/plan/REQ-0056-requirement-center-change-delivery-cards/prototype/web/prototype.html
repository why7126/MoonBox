<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求中心 · Change 独立卡片原型</title>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--surface:#edf2f8;--border:#dbe3ed;--ink:#18202f;--muted:#717c92;--gold:#b97f20;--red:#d3394b;--green:#119d7e;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #426fa1;outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.5}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
main{max-width:2068px;margin:auto;padding:16px 2.7vw 38px}.preview-note{text-align:right;font-size:13px;color:var(--muted);margin:0 0 27px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw}.column-head{display:flex;justify-content:space-between;align-items:center}.column h2{font-size:20px;margin:0;font-weight:600}.count{background:#f0ebe3;color:#96691c;border-radius:20px;padding:0 15px;font:600 15px/24px var(--mono)}.subtitle{color:var(--muted);font-size:15px;margin:2px 0 24px}.subtitle.mono{font-family:var(--mono);font-weight:500}.card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:11px;padding:16px 20px 18px;min-height:380px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 #ffffff55}.card.bug{border-left-color:var(--red)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.issue-id,.change-id{font-family:var(--mono);font-size:13px;font-style:italic;font-weight:500;color:var(--muted)}.issue-id{border:0;padding:0;background:none}.sprint{border:1px solid #d9b67a;border-radius:5px;padding:2px 7px;color:var(--gold);font:13px/1.5 var(--mono);white-space:nowrap}.change-id{margin-top:3px;overflow-wrap:anywhere;line-height:1.5;font-size:12px}.card h3{font-size:18px;line-height:1.5;margin:16px 0 12px;font-weight:600}.title-button{background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px}.tag{font-size:13px;padding:1px 10px;border-radius:20px;color:var(--muted);background:#f8faff}.tag.priority{background:#ece2ce;color:var(--gold);font-family:var(--mono)}.tag.pending{background:#f8e5ef;color:#c4417a}.tag.root{color:#279f7d;background:#e9f6f1}.tag.large{color:#8750ba;background:#eee6f7}.tag.estimate{color:#168c8a;background:#dceff0}
.docs{display:grid;gap:5px;font-size:13px;line-height:1.65}.doc-group{display:flex;align-items:baseline;gap:10px}.doc-label{color:var(--muted);flex:0 0 47px}.doc-links{display:flex;flex-wrap:wrap;gap:4px 11px;min-width:0}.doc-links button{background:none;border:0;padding:0;color:var(--gold);line-height:inherit;font:inherit;overflow-wrap:anywhere}.doc-links button:hover,.footer-action:hover{text-decoration:underline}.card-bottom{margin-top:auto;padding-top:20px}.status{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 9px}.status.warning{color:var(--red)}.status.success{color:var(--green)}.status-icon{border:1.6px solid currentColor;width:16px;height:16px;border-radius:50%;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.scope-note{margin:0 0 15px 24px;color:var(--muted);font-size:13px}.progress{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);margin:8px 0 22px;font-size:14px}.progress button{padding:0;border:0;background:none;color:inherit;display:flex;gap:6px;align-items:baseline}.progress b{font:600 14px var(--mono)}.progress .incomplete{color:var(--red)}.progress .plain{font-family:inherit}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.footer-action{color:var(--gold);background:none;padding:0;border:0;white-space:nowrap;font-size:14px}.footer-action span{padding-left:7px}
.preview-controls{margin-top:32px;color:var(--muted);font-size:12px}.preview-controls summary{cursor:pointer;width:fit-content}.control-body{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.control-body select{border:1px solid var(--border);background:var(--surface);padding:5px 8px;border-radius:4px;color:var(--ink)}.empty{border:1px dashed var(--border);padding:30px 20px;border-radius:11px;color:var(--muted);font-size:14px}
dialog{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(560px,100vw);max-width:100vw;border:0;border-left:1px solid var(--border);padding:28px;background:var(--bg);color:var(--ink);overflow:auto}dialog::backdrop{background:#17203155}.drawer-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.drawer-top h2{margin:0;font-size:20px}.close{background:none;border:1px solid var(--border);border-radius:5px;padding:4px 9px;color:var(--muted);white-space:nowrap}.drawer-id{overflow-wrap:anywhere;font:12px/1.6 var(--mono);color:var(--muted);margin:16px 0}.drawer-body{font-size:14px;line-height:1.8}.drawer-body h3{margin:24px 0 8px}.drawer-body pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.drawer-body button{background:none;border:1px solid #d9b67a;color:var(--gold);border-radius:5px;padding:6px 12px}.drawer-body select{display:block;margin:8px 0 16px;max-width:100%;padding:8px;border:1px solid var(--border);background:var(--surface)}.notice{color:var(--green)}
@media(min-width:1800px){main{padding-top:20px}.preview-note{font-size:16px;margin-bottom:36px}.column h2{font-size:25px}.subtitle{font-size:19px;margin-bottom:28px}.count{font-size:20px;line-height:30px}.card{padding:22px 29px 23px;min-height:527px;border-left-width:5px;border-radius:14px}.issue-id,.sprint{font-size:18px}.change-id{font-size:17px}.card h3{font-size:25px;margin:22px 0 18px}.tags{margin-bottom:25px;gap:10px}.tag{font-size:18px;padding:2px 13px}.docs{font-size:19px;gap:7px}.doc-label{flex-basis:65px}.doc-links{gap:5px 17px}.status{font-size:19px}.status-icon{width:21px;height:21px;font-size:14px}.scope-note{font-size:18px}.progress{font-size:19px;margin-bottom:30px}.progress b{font-size:19px}.footer{font-size:17px}.footer-action{font-size:19px}}
@media(max-width:1000px){.board{grid-template-columns:repeat(3, minmax(340px,1fr));gap:24px;overflow-x:auto;padding-bottom:14px}main{padding:16px}.preview-note{margin-bottom:24px}.card{min-height:430px}.card h3{font-size:17px}.change-id{font-size:11px}}@media(prefers-reduced-motion:no-preference){button{transition:color .15s}}
</style>
</head>
<body>
<main>
<h1 class="sr-only">需求中心 Change 独立交付卡片原型</h1>
<p class="preview-note">卡片原型 · 示例数据</p>
<section class="board" aria-label="交付看板"></section>
<details class="preview-controls"><summary>原型演示选项</summary><div class="control-body"><label for="sprint-filter">迭代范围</label><select id="sprint-filter"><option value="all">全部迭代（与原型图一致）</option><option>sprint-016</option><option>sprint-015</option><option>sprint-014</option></select><span id="counts" role="status"></span><span>仅本地演示，不读取真实文档或执行命令。</span></div></details>
</main>
<dialog id="detail" aria-labelledby="drawer-title"><div class="drawer-top"><h2 id="drawer-title"></h2><button class="close" id="close" aria-label="关闭详情">关闭 ×</button></div><div class="drawer-id" id="drawer-id"></div><div class="drawer-body" id="drawer-body"></div><p class="notice" id="notice" role="status"></p></dialog>
<script>
'use strict';
const cards=[
 {id:'add-chat-isolated-acceptance-orchestration',issue:'REQ-0048',stage:'development',title:'Chat 隔离验收与原操作续接',sprint:'sprint-016',type:'requirement',tags:[['priority','P1'],['','产品团队'],['pending','待估算']],progress:[['研发','3/12',true],['测试','0/9',false],['验收','未开始',false]],updated:'26/10/29 17:16',action:'查看进度',actionType:'tasks'},
 {id:'fix-requirement-center-read-performance',issue:'BUG-0056',stage:'acceptance',title:'需求中心首屏与刷新性能修复',sprint:'sprint-014',type:'bug',tags:[['priority','high'],['','产品团队'],['root','根因已确认'],['large','L · 5人天']],progress:[['研发','10/12',true],['测试','9/9',false],['验收','0/10',true]],updated:'26/10/27 21:28',action:'查看验收',actionType:'acceptance'},
 {id:'add-isolated-candidate-validation',issue:'REQ-0048',stage:'done',title:'固定候选隔离验收',sprint:'sprint-015',type:'requirement',tags:[['priority','P1'],['','产品团队'],['estimate','5人天']],progress:[],updated:'26/10/29 13:05',action:'查看交付',actionType:'delivery'}
];
const stages=[['development','研发中','opsx-apply / sprint-apply'],['acceptance','验收中','测试与人工验收'],['done','已完成','全链路留痕']];
const board=document.querySelector('.board'),filter=document.querySelector('#sprint-filter'),dialog=document.querySelector('#detail');let trigger=null;
function docGroup(label,names){return `<div class="doc-group"><span class="doc-label">${label}</span><div class="doc-links">${names.map(name=>`<button data-action="document" data-source="${label}" data-document="${name}">${name}</button>`).join('')}</div></div>`}
function cardMarkup(c){return `<article class="card ${c.type}" data-change-id="${c.id}" aria-label="${c.title}"><div class="card-top"><button class="issue-id" data-action="source" aria-label="查看来源 ${c.issue}">${c.issue}</button><span class="sprint">${c.sprint}</span></div><div class="change-id">${c.id}</div><h3><button class="title-button" data-action="delivery">${c.title}</button></h3><div class="tags">${c.tags.map(([type,text])=>`<span class="tag ${type}">${text}</span>`).join('')}</div><div class="docs">${docGroup('Issue',[c.type==='bug'?'bug.md':'requirement.md','trace.md','acceptance.md'])}${docGroup('Change',['proposal.md','spec.md','design.md','trace.md','tasks.md','acceptance.md'])}${docGroup('Sprint',['sprint.md','release-note.md','acceptance-report.md'])}</div><div class="card-bottom">${c.stage==='acceptance'?'<p class="status warning"><span class="status-icon" aria-hidden="true">•</span>结果待核对</p>':''}${c.stage==='done'?'<p class="status success"><span class="status-icon" aria-hidden="true">✓</span>子交付已完成</p><p class="scope-note">需求整体仍有未交付范围</p>':''}${c.progress.length?`<div class="progress">${c.progress.map(([label,value,incomplete])=>`<button data-action="${label==='验收'?'acceptance':'tasks'}" data-focus="${label}"><span>${label}</span><b class="${incomplete?'incomplete':''} ${value==='未开始'?'plain':''}">${value}</b></button>`).join('')}</div>`:''}<footer class="footer"><span>更新 ${c.updated}</span><button class="footer-action" data-action="${c.actionType}">${c.action}<span aria-hidden="true">→</span></button></footer></div></article>`}
function render(){const visible=cards.filter(c=>filter.value==='all'||c.sprint===filter.value);board.innerHTML=stages.map(([id,title,subtitle])=>{const list=visible.filter(c=>c.stage===id);return `<section class="column" aria-label="${title}"><div class="column-head"><h2>${title}</h2><span class="count">${String(list.length).padStart(2,'0')}</span></div><p class="subtitle ${id==='development'?'mono':''}">${subtitle}</p>${list.map(cardMarkup).join('')||'<div class="empty">当前迭代暂无交付</div>'}</section>`}).join('');document.querySelector('#counts').textContent=`${visible.length} 个交付 · ${new Set(visible.filter(c=>c.type==='requirement').map(c=>c.issue)).size} 个需求 · ${new Set(visible.filter(c=>c.type==='bug').map(c=>c.issue)).size} 个缺陷`}
function open(c,action,button){trigger=button;document.querySelector('#drawer-title').textContent=c.title;document.querySelector('#drawer-id').textContent=`${c.issue} / ${c.id} / ${c.sprint}`;document.querySelector('#notice').textContent='';const body=document.querySelector('#drawer-body');let html='';
 if(action==='source'){html=`<h3>来源 ${c.issue}</h3><p>${c.type==='bug'?'需求中心读取性能缺陷。':'完整需求：Chat 隔离验收环境编排与原操作续接。'}</p>${c.issue==='REQ-0048'?'<p>整体状态：部分交付。固定候选隔离验收已完成；Chat 编排与原操作续接仍有未交付范围。</p><p>旧交付保留 sprint-015，当前交付归属 sprint-016。</p>':''}<p>此处查看需求整体范围，不将它的验收数量复制到每张交付卡。</p>`}
 else if(action==='document'){const scope=button.dataset.source,name=button.dataset.document;html=`<h3>${scope} / ${name}</h3><p>文档归属：${scope==='Issue'?c.issue:scope==='Sprint'?c.sprint:c.id}</p><pre># ${name}\n\n此处仅展示文档入口与归属。\n正式页面读取对应对象的真实文档，\n不回退至其他 Change 的同名文件。</pre>`}
 else if(action==='tasks'){const focus=button.dataset.focus||'研发';html=`<h3>${focus}任务 · tasks.md</h3><p>目标：${c.id}</p><p>演示进度：${c.progress.find(p=>p[0]===focus)?.[1]||'8/8'}</p><p><label><input type="checkbox" checked disabled> 已完成的示例任务</label></p><p><label><input type="checkbox" disabled> 待完成的示例任务</label></p><p>原型只读。正式勾选需校验当前 Change、权限和文档版本。</p>`}
 else if(action==='acceptance'){html=`<h3>当前交付验收</h3><p>${c.stage==='done'?'子交付已完成':c.stage==='acceptance'?'结果待核对 · 0/10':'尚未开始'}</p><p>只展示 ${c.id} 的验收事实。</p><p>来源 ${c.issue} 的整体验收从来源入口查看。</p>`}
 else{html=`<h3>交付摘要</h3><p>来源：${c.issue}</p><p>目标：${c.id}</p><p>归属：${c.sprint}</p><p>${c.stage==='done'?'已归档子交付只读；不会自动完成父需求。':'任务、验收、会话及操作均绑定此目标。'}</p>${c.stage!=='done'?'<button id="prepare">核对阶段操作目标</button>':''}`}
 body.innerHTML=html+'<p style="color:var(--muted);margin-top:28px">合成示例，仅演示交互，不发送命令、不写入真实数据。</p>';const prepare=document.querySelector('#prepare');if(prepare)prepare.onclick=()=>{document.querySelector('#notice').textContent=`已核对 ${c.issue} → ${c.id}。未执行任何命令。`};dialog.showModal();document.querySelector('#close').focus()}
board.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const article=button.closest('[data-change-id]');const c=cards.find(c=>c.id===article.dataset.changeId);open(c,button.dataset.action,button)});
filter.addEventListener('change',render);document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});dialog.addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus()});render();
</script>
</body>
</html>
