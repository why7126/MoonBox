<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REQ-0035 Chat 执行配置选择原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d14;
      --panel: #131826;
      --raised: #1a1f2c;
      --input: #0f1320;
      --border: #242a3a;
      --line: #1b2130;
      --gold: #d8ac55;
      --text: #eceae4;
      --muted: #98a0b3;
      --danger: #d66b6b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .chat-shell {
      width: min(1040px, 100%);
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
    }

    .messages {
      min-height: 320px;
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }

    .composer {
      padding: 14px;
      background: #101522;
    }

    .config-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .select-chip {
      min-height: 32px;
      max-width: 260px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--raised);
      color: var(--text);
      font-size: 12px;
      line-height: 1;
    }

    .select-chip[aria-disabled="true"] {
      color: var(--muted);
      cursor: not-allowed;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .caret { color: var(--gold); }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      padding: 12px;
      font: inherit;
      line-height: 1.45;
    }

    button {
      min-height: 40px;
      border: 1px solid #b9832e;
      border-radius: 6px;
      background: var(--gold);
      color: #17130a;
      font-weight: 650;
      padding: 0 16px;
    }

    .menu {
      margin-top: 10px;
      width: min(360px, 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--raised);
      overflow: hidden;
    }

    .menu-item {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .menu-item:last-child { border-bottom: 0; }
    .menu-item.disabled { color: var(--muted); }
    .reason { color: var(--danger); font-size: 12px; white-space: nowrap; }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .input-row { grid-template-columns: 1fr; }
      button { width: 100%; }
      .select-chip { max-width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <main class="chat-shell" aria-label="Chat 工作台局部原型">
    <section class="messages">
      <p>本原型只展示聊天输入区执行配置栏的结构和状态，不接入真实 API。</p>
    </section>
    <section class="composer" aria-label="消息输入区">
      <div class="config-bar" aria-label="执行配置">
        <button class="select-chip" aria-disabled="true" type="button">
          <span class="label">Agent</span>
          <span class="value">Codex</span>
        </button>
        <button class="select-chip" type="button" aria-expanded="true">
          <span class="label">模型</span>
          <span class="value">gpt-6-astra</span>
          <span class="caret">v</span>
        </button>
        <button class="select-chip" type="button">
          <span class="label">推理</span>
          <span class="value">High</span>
          <span class="caret">v</span>
        </button>
      </div>

      <div class="input-row">
        <textarea aria-label="输入消息" placeholder="描述你希望 Codex 完成的工作"></textarea>
        <button type="button">发送</button>
      </div>

      <div class="menu" aria-label="模型菜单示例">
        <div class="menu-item">
          <span>gpt-6-astra</span>
          <span>默认</span>
        </div>
        <div class="menu-item">
          <span>gpt-5.6-sol</span>
          <span></span>
        </div>
        <div class="menu-item disabled" aria-disabled="true">
          <span>gpt-6-ultra-long-context-preview</span>
          <span class="reason">额度不足</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
