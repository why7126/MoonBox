<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REQ-0033 多选筛选下拉原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0A0D14;
      --panel: #131826;
      --panel-2: #1A1F2C;
      --line: #242A3A;
      --line-soft: #1B2130;
      --text: #ECEAE4;
      --muted: #98A0B3;
      --gold: #D8AC55;
      --input: #0F1320;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .page {
      min-height: 100vh;
      padding: 24px;
    }

    .title {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .search,
    .filter-trigger {
      height: 36px;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--text);
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
    }

    .search {
      width: 260px;
    }

    .filter {
      position: relative;
    }

    .filter-trigger {
      min-width: 190px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-trigger strong {
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .filter-trigger span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .popover {
      position: absolute;
      left: 0;
      top: 44px;
      width: 320px;
      max-width: calc(100vw - 48px);
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      z-index: 10;
      overflow: hidden;
    }

    .popover-head {
      padding: 10px;
      border-bottom: 1px solid var(--line-soft);
    }

    .popover-head input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--text);
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
    }

    .options {
      max-height: 250px;
      overflow: auto;
      padding: 6px;
    }

    .option {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 8px;
      border-radius: 6px;
      color: var(--text);
    }

    .option:hover {
      background: rgba(216, 172, 85, 0.12);
    }

    .option input {
      width: 14px;
      height: 14px;
      accent-color: var(--gold);
    }

    .option small {
      color: var(--muted);
      font-size: 11px;
    }

    .empty {
      margin: 6px;
      padding: 18px 10px;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
    }

    .popover-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line-soft);
    }

    .text-button {
      border: 0;
      background: transparent;
      color: var(--gold);
      font: inherit;
      padding: 0;
    }

    .board {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 12px;
    }

    .column {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      min-height: 180px;
      padding: 10px;
    }

    .column h2 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .card {
      border-left: 3px solid var(--gold);
      background: var(--input);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .card b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: var(--gold);
    }

    .card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 700px) {
      .page {
        padding: 14px;
      }

      .search,
      .filter,
      .filter-trigger {
        width: 100%;
      }

      .popover {
        width: 100%;
      }

      .board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">需求中心</h1>
    <section class="toolbar" aria-label="需求中心筛选工具栏">
      <input class="search" value="" placeholder="搜索 ID、标题或文档">
      <div class="filter">
        <button class="filter-trigger" type="button" aria-expanded="true">
          <strong>Sprint</strong>
          <span>已选 2 项</span>
        </button>
        <div class="popover" role="dialog" aria-label="Sprint 多选筛选">
          <div class="popover-head">
            <input value="sprint" aria-label="搜索 Sprint" placeholder="搜索名称或 ID">
          </div>
          <div class="options">
            <label class="option">
              <input type="checkbox" checked>
              <span>sprint-005 当前迭代</span>
              <small>当前</small>
            </label>
            <label class="option">
              <input type="checkbox" checked>
              <span>sprint-004</span>
              <small>最近</small>
            </label>
            <label class="option">
              <input type="checkbox">
              <span>sprint-003</span>
              <small>归档</small>
            </label>
          </div>
          <div class="popover-foot">
            <button class="text-button" type="button">清空 Sprint</button>
            <button class="text-button" type="button">关闭</button>
          </div>
        </div>
      </div>
      <button class="filter-trigger" type="button">
        <strong>阶段</strong>
        <span>待评审、验收中</span>
      </button>
      <button class="filter-trigger" type="button">
        <strong>优先级</strong>
        <span>P0、P1</span>
      </button>
    </section>

    <section class="board" aria-label="需求中心看板预览">
      <article class="column">
        <h2>待评审</h2>
        <div class="card">
          <b>REQ-0033</b>
          <p>筛选下拉框支持复选搜索多选与排序优化</p>
        </div>
      </article>
      <article class="column">
        <h2>验收中</h2>
        <div class="card">
          <b>REQ-0026</b>
          <p>Change 可见性与关联追溯</p>
        </div>
      </article>
      <article class="column">
        <h2>无匹配阶段</h2>
        <div class="empty">当前筛选条件下暂无卡片</div>
      </article>
    </section>
  </main>
</body>
</html>
