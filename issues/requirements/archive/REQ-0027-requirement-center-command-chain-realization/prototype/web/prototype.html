<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求中心卡片全命令产品链路真实化交互原型</title>
<style>
:root{color-scheme:dark;--bg:#0A0D14;--panel:#131826;--line:#242A3A;--text:#ECEAE4;--muted:#98A0B3;--gold:#D8AC55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Noto Sans SC",sans-serif}body.light{color-scheme:light;--bg:#F4F6FA;--panel:#FFFFFF;--line:#DDE3EE;--text:#202636;--muted:#677085;--gold:#B9832E}main{max-width:1120px;margin:40px auto;padding:24px}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:24px}h2{font-size:18px}.muted{color:var(--muted)}.id{font-family:monospace;overflow-wrap:anywhere}article{border:1px solid var(--line);background:var(--panel);padding:24px;margin:20px 0;border-radius:6px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button,select,textarea{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:4px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--gold);color:#0A0D14}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:24px;overflow:auto}dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(560px,100vw)}dialog::backdrop{background:#0009}label{display:block;margin:16px 0}select,textarea{width:100%;margin-top:6px}textarea{min-height:80px}.status{border:1px solid var(--line);padding:16px;margin:16px 0;min-height:70px}footer{position:sticky;bottom:0;background:var(--panel);padding-top:12px}a{color:var(--gold)}@media(max-width:768px){main{margin:0;padding:16px}.actions{grid-template-columns:1fr}article{padding:16px}}
</style></head><body><main><header><div><p class="muted">需求中心 · 交互原型</p><h1>需求卡片命令链路</h1></div><button id="theme">切换深浅主题</button></header><p>此页仅供需求评审：全部数据与状态为本地示意，不调用 API、不执行治理命令、不写入业务文件。</p><article data-req-id="REQ-0027-requirement-center-command-chain-realization"><p class="id">REQ-0027-requirement-center-command-chain-realization</p><h2>需求中心卡片全命令产品链路真实化</h2><p class="muted">为对照矩阵展示全部八类动作；正式页面按当前阶段展示主动作。</p><div class="actions">
<button data-testid="req-action-analyze" data-action="analysis">需求分析</button><button data-testid="req-action-generate" data-action="generate">生成需求</button><button data-testid="req-action-complete" data-action="complete">完善需求</button><button data-testid="req-action-review" data-action="review">发起评审</button><button data-testid="req-action-sprint" data-action="sprint">加入迭代</button><button data-testid="req-action-opsx" data-action="opsx">生成 OpenSpec</button><button data-testid="req-action-apply" data-action="apply">开始开发</button><button data-testid="req-action-archive" data-action="archive">完成归档</button></div></article><p class="muted">操作状态与需求生命周期分开。关闭反馈窗口不代表取消后端任务；本示意页保留会话内选定状态，刷新后重置。</p><a href="context.md">查看交互契约与验收矩阵</a></main>
<dialog id="panel" aria-labelledby="panel-title"><h2 id="panel-title"></h2><p id="gate" class="muted"></p><div id="choices"></div><label id="state-label">查看操作状态示意<select id="state"><option value="ready">待提交</option><option value="accepted">已受理</option><option value="running">运行中</option><option value="blocked">需补充信息</option><option value="failure">执行失败</option><option value="partial">部分写入、待恢复</option><option value="sync">状态同步失败</option><option value="conflict">版本冲突</option><option value="denied">权限不足</option><option value="success">已完成</option></select></label><div class="status" data-testid="req-operation-status" role="status" aria-live="polite"></div><div data-testid="req-artifacts"></div><footer><button data-testid="req-panel-cancel">取消 / 关闭</button><button class="primary" data-testid="req-panel-submit">模拟提交</button></footer></dialog>
<script>
const panel=document.querySelector('#panel'), choices=document.querySelector('#choices'), state=document.querySelector('#state'), statusBox=document.querySelector('[data-testid="req-operation-status"]'), submit=document.querySelector('[data-testid="req-panel-submit"]'), artifacts=document.querySelector('[data-testid="req-artifacts"]');
const actions={analysis:['需求分析','只读分析：仅可读取当前授权对象，不修改治理文件。'],generate:['生成需求','captured / exploring；capture、trace 非空。'],complete:['完善需求','draft / enriching；capture、trace、requirement 非空。'],review:['发起评审','pending_review；需求文档齐全；取消不记录评审。'],sprint:['加入迭代','approved 且评审通过；多 active 需明确选择，保留已有容量。'],opsx:['生成 OpenSpec','in_sprint；当前 REQ 在 Sprint 正式范围内。'],apply:['开始开发','已关联有效 Change 且双方在 Sprint 范围内；受理不等于真实启动。'],archive:['完成归档','任务、测试、人工验收和文档门禁全部通过；部分归档不提前 done。']};
const messages={ready:'尚未提交。',accepted:'请求已受理，尚不能声明命令完成。',running:'操作运行中，可关闭窗口后重新查看。',blocked:'缺少必备文档，请先补齐。',failure:'执行失败，请根据操作标识查看安全错误摘要。',partial:'部分文件已写入，待核实已完成步骤后恢复。',sync:'文件已写入，状态同步失败，待恢复。',conflict:'对象已更新，请刷新后重试。',denied:'你没有执行此操作的权限。',success:'完成状态示意：只有产物校验、Workflow Sync 和事实重读均成功后才能展示。'};
let current='',trigger=null;const states={};
function render(){states[current]=state.value;statusBox.textContent=current==='analysis'?'只读分析：这里仅展示分析内容，不提供生成、开发或归档授权。':messages[state.value];submit.disabled=['accepted','running','blocked','denied','partial','sync','conflict','success'].includes(state.value);artifacts.textContent=current!=='analysis'&&state.value==='success'?'产物入口区域：实际产品在此展示服务端授权的最新文档，本原型不伪造文件或成功证据。':'';}
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{trigger=button;current=button.dataset.action;panel.classList.toggle('drawer',current==='analysis');panel.dataset.testid='req-panel-'+current;document.querySelector('#panel-title').textContent=actions[current][0];document.querySelector('#gate').textContent=actions[current][1];choices.replaceChildren();if(current==='review')choices.innerHTML='<label>评审结论<select id="decision"><option value="approved">通过</option><option value="rejected">拒绝</option><option value="deferred">延后</option></select></label><label>理由（拒绝或延后必填）<textarea id="reason"></textarea></label>';if(current==='sprint')choices.innerHTML='<label>迭代选择<select><option>当前 active 迭代（示意）</option><option>新建下一个连续编号（示意）</option></select></label><p>无 active 默认新建；多个 active 不预选。容量默认30人天，已有有效容量保持不变。</p>';if(['generate','complete'].includes(current))choices.innerHTML='<p>执行方式：AI 命令。本原型不重建文件导入入口。</p>';if(current==='archive')choices.innerHTML='<p>确认前展示任务、测试、人工验收和文档门禁摘要；不以任务全勾选替代验收。</p>';state.value=states[current]||'ready';document.querySelector('#state-label').hidden=current==='analysis';submit.hidden=current==='analysis';render();panel.showModal();}));
state.addEventListener('change',render);submit.addEventListener('click',()=>{if(current==='review'&&document.querySelector('#decision').value!=='approved'&&!document.querySelector('#reason').value.trim()){statusBox.textContent='请填写拒绝或延后的理由。';document.querySelector('#reason').focus();return;}state.value='accepted';render();});document.querySelector('[data-testid="req-panel-cancel"]').addEventListener('click',()=>panel.close());panel.addEventListener('close',()=>trigger?.focus());document.addEventListener('pointerdown',event=>{if(!panel.open||event.target!==panel)return;const r=panel.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)panel.close();},true);document.querySelector('#theme').addEventListener('click',()=>document.body.classList.toggle('light'));
</script></body></html>
