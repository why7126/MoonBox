<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat 持续执行状态原型</title><style>body{margin:0;padding:24px;background:#F4F6FA;color:#202636;font:14px/1.45 Inter,"Noto Sans SC",sans-serif}main{max-width:960px;margin:auto}section{background:#fff;border:1px solid #DDE3EE;border-radius:6px;padding:24px;margin:16px 0}h1{font-size:22px}h2{font-size:18px}button,select{padding:10px 14px;border:1px solid #DDE3EE;border-radius:6px;background:#fff;color:inherit}button:focus-visible,select:focus-visible{outline:2px solid #B9832E;outline-offset:3px}button:disabled{opacity:.5}#recover{background:#B9832E;color:white}.actions{display:flex;flex-wrap:wrap;gap:12px}pre{white-space:pre-wrap;overflow:auto;max-height:180px;background:#F4F6FA;padding:16px}small{color:#677085}@media(max-width:600px){body{padding:12px}section{padding:16px}}@media(prefers-color-scheme:dark){body{background:#0A0D14;color:#ECEAE4}section,select,button{background:#131826;border-color:#242A3A}pre{background:#0F1320}small{color:#98A0B3}}</style><main><small>需求评审线框 · 示例数据 · 不执行真实操作</small><h1>Chat 持续执行</h1><label for="scenario">示例状态 </label><select id="scenario"><option value="preparing">准备中</option><option value="running">执行中</option><option value="blocked">准备资源不足</option><option value="interrupted">运行中断</option><option value="unknown">结果待核验</option><option value="completed">已完成</option></select><section id="panel"><h2 id="status"></h2><p id="summary" role="status" aria-live="polite"></p><details id="reason"><summary>查看原因与处理说明</summary><p id="detail"></p></details><p class="actions"><button id="saved">查看已保存内容</button><button id="recover">核验原轮次</button></p><pre id="content" hidden>示例：已保存的过程记录。实际产品按可信游标分段读取，不一次加载全部内容。</pre><p id="feedback" aria-live="polite"></p></section></main><script>const states={preparing:['准备中','正在分批扫描与校验基线，模型尚未启动。','完成校验后才发布可信基线。'],running:['执行中','过程输出持续保存，可按需读取。','示例已保存 12 段；实际数量来自持久化记录。'],blocked:['准备资源不足','模型尚未启动，上一有效基线已保留。','示例：可用磁盘不足，请释放或增加资源后重新检查。'],interrupted:['运行中断','已保存的内容可读，尾段完整性尚待核对。','先核验原执行，避免重新应用已完成操作。'],unknown:['结果待核验','尚未取得可信执行终态。','不能直接重发原命令；先核验，无法证实时提供人工处理路径。'],completed:['已完成','示例执行完成，保存完整性已核验。','实际产品分别读取执行终态与成果证明。']};const q=id=>document.getElementById(id);function render(){const s=q('scenario').value;const a=states[s];q('status').textContent=a[0];q('summary').textContent=a[1];q('detail').textContent=a[2];q('recover').textContent=s==='blocked'?'重新检查资源并续接准备':'核验原轮次';q('recover').disabled=!['blocked','interrupted','unknown'].includes(s);q('saved').disabled=['preparing','blocked'].includes(s);q('content').hidden=true;q('feedback').textContent='';}q('scenario').onchange=render;q('saved').onclick=()=>{q('content').hidden=!q('content').hidden};q('recover').onclick=()=>{q('recover').disabled=true;q('feedback').textContent='演示：正在核验。此原型不调用 API，也不证明恢复成功。'};render();</script></html>
