<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture · MoonBox 交互原型</title><style>
:root{--bg:#0A0D14;--panel:#131826;--raised:#1A1F2C;--input:#0F1320;--line:#242A3A;--gold:#D8AC55;--text:#ECEAE4;--muted:#98A0B3;--danger:#e99992;--ok:#90c3a7;color-scheme:dark}body.light{--bg:#F4F6FA;--panel:#fff;--raised:#EEF2F7;--input:#F8FAFD;--line:#DDE3EE;--gold:#B9832E;--text:#202636;--muted:#677085;--danger:#a9433a;--ok:#35704b;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Noto Sans SC",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--text);padding:8px 13px;cursor:pointer}button:hover{background:var(--raised);border-color:var(--muted)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.primary{background:var(--gold);border-color:var(--gold);color:#14120d;font-weight:650}.primary:hover{background:var(--gold);filter:brightness(1.08)}.muted,small{color:var(--muted)}.mono{font:11px/1.5 "JetBrains Mono",monospace;letter-spacing:.08em}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line)}.brand{font-size:18px;letter-spacing:.06em}.brand b{color:var(--gold)}.top-right{display:flex;gap:15px;align-items:center}.breadcrumb{max-width:1200px;margin:25px auto 14px;color:var(--muted);display:flex;justify-content:space-between}.workspace{max-width:1200px;margin:auto;background:var(--panel);border:1px solid var(--line)}header{padding:24px 28px 0}h1{font-size:25px;font-weight:600;margin:0 0 7px}h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:0}p{margin:6px 0 14px}.steps{display:flex;margin-top:25px;gap:32px;border-bottom:1px solid var(--line)}.step{padding:0 0 15px;color:var(--muted);border-bottom:2px solid transparent}.step.active{color:var(--gold);border-bottom-color:var(--gold)}.step span{display:inline-block;margin-right:8px;font-family:monospace}.layout{display:grid;grid-template-columns:320px 1fr;min-height:490px}aside{padding:23px;border-right:1px solid var(--line);background:var(--input)}.source{margin-top:16px;padding:16px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap}.source p{font-size:13px;margin-bottom:0}.caption{margin-top:15px;font-size:12px;color:var(--muted)}.content{padding:23px 26px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}.summary{font-size:12px;color:var(--gold)}.candidate{padding:17px 18px;border:1px solid var(--line);margin-bottom:12px;background:var(--panel)}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.identity{display:flex;align-items:center;gap:10px}.badge{font-size:11px;padding:3px 7px;background:var(--raised);color:var(--gold)}.badge.bug{color:var(--danger)}.candidate h3{margin:14px 0 8px}.candidate p{font-size:13px;color:var(--muted);margin:0 0 13px}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;gap:8px}.card-actions{display:flex;gap:5px;flex-wrap:wrap}.card-actions button{padding:4px 8px;font-size:12px}.source-link{color:var(--muted);padding:3px 0;border:0;font-size:12px}.footer{padding:17px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.save{color:var(--ok);font-size:12px}.demo-note{max-width:1200px;margin:14px auto;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px}.tools{display:flex;gap:8px;align-items:center}.tools button{font-size:11px;padding:4px 8px}textarea,input[type=text],select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:2px;padding:10px;color:var(--text)}textarea{resize:vertical;min-height:150px}label{display:block;margin:14px 0 6px}input[type=checkbox]{accent-color:var(--gold)}.upload{border:1px dashed var(--line);padding:22px;margin-top:18px;text-align:center}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumb{width:100px}.thumb img{width:100px;height:74px;object-fit:contain;border:1px solid var(--line)}.thumb button{font-size:11px;padding:2px 5px}.alert{padding:12px 15px;margin-bottom:14px;background:var(--input);border-left:2px solid var(--gold);color:var(--muted)}.error{border-color:var(--danger);color:var(--danger)}.result{padding:40px 20px;max-width:630px;margin:auto}.result-icon{font-size:28px;color:var(--gold);margin-bottom:18px}.result-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;width:min(610px,calc(100vw - 32px));padding:25px;max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}dialog .actions{justify-content:flex-end;margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--raised);border:1px solid var(--gold);z-index:20;max-width:90vw}#toast:empty{display:none}[hidden]{display:none!important}@media(min-width:901px){.layout{max-height:calc(100vh - 320px);min-height:390px}.content,aside{overflow:auto}}@media(max-width:1240px){.workspace,.breadcrumb,.demo-note{margin-left:20px;margin-right:20px}}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}aside .source{max-height:120px;overflow:auto}.top{padding:0 18px}.footer{align-items:flex-start}.demo-note{flex-direction:column}.top .mono{display:none}}@media(max-width:500px){.workspace,.breadcrumb,.demo-note{margin-left:10px;margin-right:10px}header,.content,aside{padding:18px}.top-right .muted{display:none}.steps{gap:18px;font-size:12px}.footer{padding:15px;flex-direction:column}.card-foot{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.top-right{gap:5px}h1{font-size:22px}}
</style></head><body><nav class="top"><div class="brand"><b>◈</b> MOONBOX <span class="mono muted"> / PRODUCT WORKSPACE</span></div><div class="top-right"><span class="muted">演示项目</span><button id="theme">切换主题</button></div></nav><div class="breadcrumb"><span>需求中心 / 新建 Capture</span><span class="mono">REVIEW BEFORE CREATE</span></div><main class="workspace" data-testid="capture-workspace"><header><h1>把想法，整理成下一步</h1><p class="muted">先自由记录，再一起审阅。确认后才生成正式采集记录。</p><div class="steps"><div class="step" data-step="1"><span>01</span>原始材料</div><div class="step active" data-step="2"><span>02</span>审阅候选</div><div class="step" data-step="3"><span>03</span>创建结果</div></div></header><div class="layout"><aside><div class="mono muted">SOURCE MATERIAL</div><h3 style="margin-top:8px">这次反馈的原始材料</h3><div class="source"><span class="badge">文字来源 1</span><p id="source-text"></p></div><div id="source-images" class="thumbs"></div><p class="caption">每条候选保留来源依据。改类型、合并或拆分后，关联仍然可追溯。</p><button id="back-input" style="margin-top:8px">查看 / 编辑材料</button></aside><section class="content" id="content" aria-live="polite"></section></div><footer class="footer"><span class="save" id="save">演示草稿已保存</span><div class="actions" id="footer-actions"></div></footer></main><div class="demo-note"><span>交互原型 · 全部为本地演示数据，不上传图片、不调用 AI、不写入正式 Issue。</span><div class="tools"><label style="margin:0"><input id="fail" type="checkbox"> 模拟创建中断</label><button id="reset">重置演示</button></div></div><dialog id="modal" aria-labelledby="modal-title"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="actions"><button id="modal-cancel">取消</button><button class="primary" id="modal-ok">保存调整</button></div></dialog><div id="toast" role="status"></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seedText='希望反馈时可以附上截图，系统自动判断是需求还是问题。\n另外，列表刷新后会回到顶部，刚才读到的位置就丢了。';
const seeds=()=>[{id:crypto.randomUUID(),type:'requirement',grade:'P1',title:'反馈入口支持图片与自动分类',desc:'提交反馈时附图片，由系统整理需求或问题，减少手工填写。',sources:['文字来源 1'],reason:'新增输入能力，属于尚未交付的功能诉求。'},{id:crypto.randomUUID(),type:'bug',grade:'medium',title:'列表刷新后阅读位置丢失',desc:'用户反馈刷新后回到顶部，希望保留当前阅读位置；实际复现范围仍需后续核实。',sources:['文字来源 1'],reason:'用户描述已有交互的偏差，建议按缺陷审阅；复现证据待补。'}];
let state={step:2,text:seedText,items:seeds(),revision:1,task:null},images=[],selection=new Set(),saveTimer,modalAction,preview=false;
try{let saved=JSON.parse(localStorage.getItem('req29-prototype')||'null');if(saved)state=saved}catch{}
function toast(t){$('#toast').textContent=t;setTimeout(()=>$('#toast').textContent='',2600)}
function persist(){try{localStorage.setItem('req29-prototype',JSON.stringify(state));$('#save').textContent='演示草稿已保存 · 图片仅在当前预览会话保留'}catch{$('#save').textContent='本地保存失败'}}
function changed(){state.revision++;$('#save').textContent='正在保存演示草稿…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,1000)}
function levels(t){return t==='bug'?['blocker','critical','high','medium','low']:['P0','P1','P2','P3']}
function modal(title,html,action,button='保存调整'){preview=false;$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;$('#modal-ok').textContent=button;$('#modal-ok').hidden=false;modalAction=action;$('#modal').showModal()}
$('#modal-cancel').onclick=()=>$('#modal').close();$('#modal-ok').onclick=()=>{if(!modalAction||modalAction()!==false)$('#modal').close()};$('#modal').addEventListener('click',e=>e.stopPropagation());document.addEventListener('pointerdown',e=>{if(preview&&$('#modal').open){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}},true);
function edit(id){let x=state.items.find(x=>x.id===id);modal('编辑候选',`<div class="grid"><div><label for="etype">类型</label><select id="etype"><option value="requirement">需求</option><option value="bug">缺陷</option></select></div><div><label for="grade">分级</label><select id="grade"></select></div></div><label for="title">标题</label><input type="text" id="title" maxlength="60" value="${esc(x.title)}"><label for="description">描述</label><textarea id="description" maxlength="10000">${esc(x.desc)}</textarea><p class="caption">类型调整保留内容与图片。目标类型的分级请重新审阅。</p>`,()=>{if(!$('#title').value.trim()){toast('请填写标题');return false}Object.assign(x,{type:$('#etype').value,grade:$('#grade').value,title:$('#title').value,desc:$('#description').value});changed();render()});$('#etype').value=x.type;function options(){let list=levels($('#etype').value);$('#grade').innerHTML=list.map(l=>`<option>${l}</option>`).join('');$('#grade').value=$('#etype').value===x.type?x.grade:$('#etype').value==='bug'?'medium':'P1'}options();$('#etype').onchange=options}
function source(id){let x=state.items.find(x=>x.id===id);modal('来源依据',`<p>${esc(x.reason)}</p><div class="source">${esc(state.text)}</div><p class="caption">关联：${esc(x.sources.join('、'))}</p>`,null);preview=true;$('#modal-ok').hidden=true;$('#modal-cancel').textContent='关闭'}
function split(id){let x=state.items.find(x=>x.id===id);modal('拆分候选',`<p class="muted">为两个独立诉求分别填写标题，来源关系会保留。</p><label for="split-a">条目 A</label><input type="text" id="split-a" value="${esc(x.title)}" maxlength="60"><label for="split-b">条目 B</label><input type="text" id="split-b" placeholder="第二个独立诉求" maxlength="60">`,()=>{let a=$('#split-a').value.trim(),b=$('#split-b').value.trim();if(!a||!b){toast('请填写两个条目的标题');return false}let n=state.items.indexOf(x);state.items.splice(n,1,...[a,b].map(title=>({...x,id:crypto.randomUUID(),title,parents:[x.id],sources:[...x.sources]})));selection.clear();changed();render()},'确认拆分')}
function remove(id){modal('删除这条候选？','<p>仅从当前确认集合移除，其他条目的来源材料不受影响。</p>',()=>{state.items=state.items.filter(x=>x.id!==id);selection.delete(id);changed();render()},'删除候选')}
function merge(){let rows=state.items.filter(x=>selection.has(x.id));if(rows.length<2)return;modal('合并所选候选',`<p class="muted">${rows.length} 条合为一个交付单元，原始依据全部保留。</p><label for="merge-title">合并后标题</label><input type="text" id="merge-title" maxlength="60" value="${esc(rows[0].title)}">`,()=>{let title=$('#merge-title').value.trim();if(!title){toast('请填写标题');return false}state.items=state.items.filter(x=>!selection.has(x.id));state.items.push({...rows[0],id:crypto.randomUUID(),title,desc:rows.map(x=>x.desc).join('\n'),sources:[...new Set(rows.flatMap(x=>x.sources))],parents:rows.map(x=>x.id),reason:'由用户合并，请核对最终类型与分级。'});selection.clear();changed();render()},'合并并继续审阅')}
function confirmBatch(){let req=state.items.filter(x=>x.type==='requirement').length;modal('确认创建这批采集记录',`<p>共 ${state.items.length} 条：${req} 条需求、${state.items.length-req} 条缺陷。</p><p class="muted">本次确认固定当前内容。正式产品会由服务端分配编号，并在整批完成后返回结果。</p><div class="alert">此处仅模拟流程，不创建任何正式记录。</div>`,()=>{persist();state.task=state.task||{version:state.revision,status:'creating',items:JSON.parse(JSON.stringify(state.items))};state.step=3;runTask()},'确认并创建')}
function runTask(){state.task.status='creating';render();persist();setTimeout(()=>{state.task.status=$('#fail').checked?'failed':'done';persist();render()},850)}
function render(){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',Number(x.dataset.step)===state.step));$('#source-text').textContent=state.text;$('#back-input').disabled=!!state.task;$('#modal-cancel').textContent='取消';let content=$('#content'),foot=$('#footer-actions');
if(state.step===1){content.innerHTML=`<h2>记录你的需求或问题</h2><p class="muted">先写下发生了什么，或者你希望实现什么。</p><label for="raw">原始描述</label><textarea id="raw" maxlength="20000">${esc(state.text)}</textarea><div class="upload"><label for="files" style="margin:0">添加图片 · 可选择多张</label><input type="file" id="files" accept="image/png,image/jpeg,image/webp" multiple><p class="caption">最多 10 张 · 单张 10 MiB · 总计 50 MiB<br>原型仅本地预览；真实上传与像素校验待实现。</p><div id="input-images" class="thumbs"></div></div>`;foot.innerHTML='<button id="restore">恢复演示候选</button><button class="primary" id="organize">AI 整理候选</button>';$('#raw').oninput=e=>{state.text=e.target.value;$('#source-text').textContent=state.text;changed()};$('#restore').onclick=()=>{state.step=2;render()};$('#organize').onclick=()=>{if(!state.text.trim()&&!images.length){toast('请添加文字或图片');return}modal('演示整理结果','<p>原型不会调用模型。将展示固定的两条候选，用于审阅交互；你输入的材料不会被宣称已经过 AI 理解。</p>',()=>{state.items=seeds();state.step=2;changed();render()},'加载演示候选')};$('#files').onchange=e=>{let fs=[...e.target.files];if(images.length+fs.length>10||fs.some(f=>f.size>10*1024*1024)||fs.reduce((s,f)=>s+f.size,images.reduce((s,f)=>s+f.size,0))>50*1024*1024||fs.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type))){toast('图片格式、数量或体积超限');return}fs.forEach(f=>images.push({name:f.name,size:f.size,url:URL.createObjectURL(f)}));renderImages();toast('本地预览已就绪；没有上传到服务端')};renderImages()}
else if(state.step===2){let req=state.items.filter(x=>x.type==='requirement').length;content.innerHTML=`<div class="section-head"><div><h2>审阅整理结果</h2><span class="summary">${state.items.length} 条候选 · ${req} 条需求 / ${state.items.length-req} 条缺陷</span></div><button id="merge" ${selection.size<2?'disabled':''}>合并所选（${selection.size}）</button></div><div class="alert">这些仍是候选。你可以调整类型和内容，确认前不会分配正式编号。</div><div id="candidates">${state.items.length?state.items.map((x,i)=>`<article class="candidate" data-id="${x.id}"><div class="card-head"><div class="identity"><input type="checkbox" aria-label="选择条目 ${i+1}" data-select="${x.id}" ${selection.has(x.id)?'checked':''}><span class="mono">条目 ${i+1}</span><span class="badge ${x.type==='bug'?'bug':''}">${x.type==='bug'?'缺陷':'需求'}</span></div><span class="muted mono">${esc(x.grade)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="card-foot"><button class="source-link" data-source="${x.id}">来源依据 · ${x.sources.length} 项 ↗</button><div class="card-actions"><button data-edit="${x.id}">编辑 / 改类型</button><button data-split="${x.id}">拆分</button><button data-remove="${x.id}">删除</button></div></div></article>`).join(''):'<div class="empty">暂无候选，可返回原始材料重新整理。</div>'}</div>`;foot.innerHTML='<button id="close">关闭并保留草稿</button><button class="primary" id="confirm" '+(!state.items.length?'disabled':'')+'>确认创建 '+state.items.length+' 条 →</button>';$('#merge').onclick=merge;$('#confirm').onclick=confirmBatch;$('#close').onclick=()=>{persist();toast('演示草稿已保留，可关闭本页后重新打开')};content.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{el.checked?selection.add(el.dataset.select):selection.delete(el.dataset.select);render()});for(let [key,fn] of [['edit',edit],['split',split],['remove',remove],['source',source]])content.querySelectorAll('[data-'+key+']').forEach(el=>el.onclick=()=>fn(el.dataset[key]))}
else{let t=state.task,failed=t.status==='failed',done=t.status==='done';content.innerHTML=`<div class="result"><div class="mono muted">BATCH RESULT · 演示</div><div class="result-icon">${done?'✓':failed?'!':'◌'}</div><h2>${done?'整批采集完成':failed?'创建中断，可继续恢复':'正在创建这批记录'}</h2><p class="muted">${done?'演示结果如下；实际编号应由服务端返回。':failed?'确认内容与任务已保留，重试将续作原任务，不重新创建。':'内容已固定，正在处理；受理不代表创建完成。'}</p>${done?t.items.map((x,i)=>`<div class="result-row"><span>${esc(x.title)}</span><span class="mono">演示 ${x.type==='bug'?'BUG':'REQ'} · ${i+1}</span></div>`).join(''):'<div class="alert">整批完成前，正式看板保持上一个完整快照。</div>'}</div>`;foot.innerHTML=failed?'<button id="retry" class="primary">重试原任务</button>':done?'<button id="new" class="primary">开始新一批</button>':'<button disabled>处理中…</button>';if(failed)$('#retry').onclick=()=>{$('#fail').checked=false;runTask()};if(done)$('#new').onclick=()=>{state={step:1,text:'',items:[],revision:1,task:null};images=[];persist();render()}}
}
function renderImages(){for(let sel of ['#source-images','#input-images']){let host=$(sel);if(!host)continue;host.innerHTML=images.map((im,i)=>`<div class="thumb"><img src="${im.url}" alt="${esc(im.name)}"><button data-image="${i}">移除图片 ${i+1}</button></div>`).join('');host.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{URL.revokeObjectURL(images[b.dataset.image].url);images.splice(Number(b.dataset.image),1);renderImages()})}}
$('#back-input').onclick=()=>{state.step=1;render()};$('#theme').onclick=()=>document.body.classList.toggle('light');$('#reset').onclick=()=>{state={step:2,text:seedText,items:seeds(),revision:1,task:null};selection.clear();images=[];persist();render()};render();if(state.task?.status==='creating'){state.task.status='failed';render()}
</script></body></html>
