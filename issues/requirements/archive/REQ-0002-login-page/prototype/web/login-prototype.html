<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REQ-0002 Web 登录页原型摘录</title>
  <style>
    :root {
      --bg: #0a0c1b;
      --panel: #12142b;
      --border: rgba(234, 242, 255, .16);
      --text: #e7e8f3;
      --muted: #7c81a6;
      --gold: #cba35c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 96px 24px 48px;
      color: var(--text);
      background:
        linear-gradient(rgba(10, 12, 27, .56), rgba(10, 12, 27, .88)),
        radial-gradient(circle at 50% 26%, rgba(203, 163, 92, .18), transparent 28%),
        var(--bg);
      font-family: "Noto Sans SC", system-ui, sans-serif;
    }

    .back-home {
      position: fixed;
      top: 32px;
      left: 48px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .login-card {
      width: min(420px, 100%);
      min-height: 640px;
      padding: 40px 44px;
      border: 1px solid var(--border);
      background: rgba(18, 20, 43, .94);
    }

    .logo {
      width: 220px;
      height: 84px;
      margin: 0 auto 34px;
      display: grid;
      place-items: center;
      background: #07152e;
      color: var(--text);
      border: 1px solid rgba(234, 242, 255, .08);
      font-family: "EB Garamond", Georgia, serif;
      font-size: 28px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      letter-spacing: 0;
    }

    .intro {
      margin: 12px 0 42px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: grid;
      gap: 12px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="text"],
    input[type="password"] {
      height: 45px;
      border: 1px solid rgba(234, 242, 255, .18);
      border-radius: 0;
      padding: 0 14px;
      color: var(--text);
      background: #0b0d1d;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -6px 0 36px;
    }

    .submit {
      width: 100%;
      height: 47px;
      border: 0;
      border-radius: 2px;
      color: #101010;
      background: var(--gold);
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      body { padding: 80px 16px 32px; }
      .back-home { left: 20px; top: 24px; }
      .login-card { min-height: auto; padding: 32px 24px; }
      .logo { width: 100%; max-width: 220px; }
    }
  </style>
</head>
<body>
  <a class="back-home" href="#">← 返回首页</a>
  <form class="login-card">
    <div class="logo" aria-label="MoonBox Logo">MoonBox</div>
    <h1>开启你的宝盒</h1>
    <p class="intro">登录 MoonBox，继续构建你的 Agent 研发组织。</p>
    <label>
      用户名
      <input type="text" name="username" autocomplete="username" placeholder="请输入用户名" required>
    </label>
    <label>
      密码
      <input type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
    </label>
    <label class="remember">
      <input type="checkbox" name="remember">
      记住我
    </label>
    <button class="submit" type="submit">登录并开启宝盒</button>
  </form>
</body>
</html>
