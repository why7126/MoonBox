<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat 自主验收状态反馈原型</title><style>body{margin:0;background:#f4f6fa;color:#202636;font:16px/1.6 system-ui}main{max-width:900px;margin:48px auto;padding:24px}article{background:white;border:1px solid #dde3ee;border-radius:14px;padding:24px}h1{font-size:24px}button,select{font:inherit;padding:8px 12px;border:1px solid #dde3ee;border-radius:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}#actions{display:flex;flex-wrap:wrap;gap:8px}#stage{color:#8f641f;font-weight:700}small{color:#667085}dialog{border:1px solid #dde3ee;border-radius:12px;max-width:80vw}p{overflow-wrap:anywhere}@media(max-width:600px){main{margin:12px auto;padding:12px}article{padding:16px}}</style><main><small>交互结构原型 · 合成数据 · 无 API</small><h1>原 Chat 会话 · 自主验收</h1><label>演示状态 <select id="state"><option>准备环境</option><option>验收中</option><option>局部阻塞</option><option>恢复中</option><option>已停止</option><option>已释放</option><option>清理失败</option></select></label><article><p id="stage"></p><p id="feedback" role="status"></p><p id="checks"></p><details id="details"><summary>执行详情</summary><p>原操作：示例操作 A · 来源轮次保持原始状态</p><p>隔离数据库：MySQL 8.4 · 版本须与模板一致</p><p>代码与计划：当前快照 · 短期身份仅限本任务</p><p>租约：持续核验 · 到期资源回收与证据保留分开记录</p></details><p id="message" role="status"></p><div id="actions"><button id="evidence">查看证据</button><button id="verify">重新核验</button><button id="resume">继续</button><button id="stop">停止</button></div></article><dialog id="confirm-stop"><h2>停止本次验收？</h2><p>保留已取得证据，取消后续执行并清理所属临时资源。不会自动重启模型。</p><form method="dialog"><button value="cancel">返回</button><button id="confirm" value="stop">确认停止</button></form></dialog></main><script>const $=id=>document.getElementById(id);const texts={'准备环境':['正在准备隔离数据库与当前版本应用','已通过 0 / 12'],'验收中':['正在采集当前版本的真实验收证据','已通过 5 / 12'],'局部阻塞':['数据库尚未就绪，其他独立检查继续','已通过 3 / 12 · 2 项受阻'],'恢复中':['正在核对原任务，保留原轮次终态','已通过 5 / 12'],'已停止':['已停止后续执行，正在确认资源回收','已通过 5 / 12 · 未完成验收'],'已释放':['验收通过，临时资源已释放，证据按期限保留','已通过 12 / 12'],'清理失败':['测试结果已保存，临时资源清理待重试','已通过 12 / 12 · 生命周期验收未完成']};function render(){const s=$('state').value;$('stage').textContent=s;$('feedback').textContent=texts[s][0];$('checks').textContent=texts[s][1];$('resume').textContent=s==='清理失败'?'重试清理':'继续';$('resume').disabled=!['局部阻塞','清理失败'].includes(s);$('stop').disabled=['已停止','已释放','清理失败'].includes(s);$('message').textContent='';} $('state').onchange=render;$('evidence').onclick=()=>{$('message').textContent='原型说明：产品中只展示获授权且当前有效的证据。'};$('verify').onclick=()=>{$('message').textContent='原型说明：仅查询核验，不重新启动验收。'};$('resume').onclick=()=>{$('message').textContent='原型说明：真实操作须再次检查权限、输入版本和任务占用。'};$('stop').onclick=()=>$('confirm-stop').showModal();$('confirm-stop').onclose=()=>{if($('confirm-stop').returnValue==='stop'){$('state').value='已停止';render();}};render();</script></html>
