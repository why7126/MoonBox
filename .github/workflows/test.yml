name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: moonbox
          MYSQL_USER: moonbox
          MYSQL_PASSWORD: change-me
          MYSQL_ROOT_PASSWORD: change-me-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -umoonbox -pchange-me --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi pydantic "uvicorn[standard]" sqlalchemy pymysql pytest httpx
      - run: PYTHONPATH=src/backend pytest
        env:
          RUN_MYSQL_TESTS: "1"
          MYSQL_DATABASE_URL: mysql+pymysql://moonbox:change-me@127.0.0.1:3306/moonbox
